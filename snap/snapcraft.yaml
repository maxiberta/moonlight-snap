name: moonlight
base: core26
adopt-info: moonlight-qt
grade: stable
confinement: strict
license: GPL-3.0+
icon: moonlight.svg
compression: lzo
summary: Stream games and apps from another PC running Sunshine or GeForce Experience

environment:
  FONTCONFIG_FILE: $SNAP/etc/fonts/fonts.conf
  FONTCONFIG_PATH: $SNAP/etc/fonts
  LD_LIBRARY_PATH: $SNAP/usr/lib:$SNAP/usr/lib64:$SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR:$SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libproxy:$SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/pulseaudio:$SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/sdl2-compat
  LIBDECOR_PLUGIN_DIR: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libdecor/plugins-1
  QML2_IMPORT_PATH: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/qt6/qml
  QML_DISABLE_DISK_CACHE: 1
  QT_PLUGIN_PATH: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/qt6/plugins
  QT_QUICK_CONTROLS_STYLE: Material
  XDG_DATA_DIRS: $SNAP/usr/share:$SNAP/usr/local/share:/usr/local/share:/usr/share:/var/lib/snapd/desktop

apps:
  moonlight:
    command-chain: &command-chain
      - bin/snap-launch
    command: usr/bin/moonlight
    common-id: com.moonlight_stream.Moonlight
    desktop: usr/share/applications/com.moonlight_stream.Moonlight.desktop
    extensions: [gpu]
    plugs: &plugs
      - audio-playback
      - desktop
      - desktop-legacy
      - home
      - joystick
      - network
      - opengl
      - screen-inhibit-control
      - wayland
      - x11

parts:
  launcher:
    plugin: dump
    source: snap/local

  moonlight-qt:
    plugin: qmake
    qmake-major-version: 6
    source: https://github.com/moonlight-stream/moonlight-qt.git
    source-tag: v6.2.0
    parse-info:
      - app/deploy/linux/com.moonlight_stream.Moonlight.appdata.xml
      - usr/share/metainfo/com.moonlight_stream.Moonlight.appdata.xml
    override-pull: |
      craftctl default
      craftctl set version=$(git describe --tags | sed "s/^v//")
    build-environment:
      - CFLAGS: -O2 -g -pipe
      - CXXFLAGS: -O2 -g -pipe
      - CPATH: ${CRAFT_STAGE}/usr/include/SDL2:${CRAFT_STAGE}/usr/include
      - LIBRARY_PATH: ${CRAFT_STAGE}/usr/lib64:${CRAFT_STAGE}/usr/lib:${CRAFT_STAGE}/usr/lib/${CRAFT_ARCH_TRIPLET_BUILD_FOR}
      - CMAKE_PREFIX_PATH: ${CRAFT_STAGE}/usr/lib/cmake:${CRAFT_STAGE}/usr/local/lib/cmake
      - PKG_CONFIG_PATH: ${CRAFT_STAGE}/lib/pkgconfig:${CRAFT_STAGE}/lib64/pkgconfig:${CRAFT_STAGE}/usr/lib/pkgconfig:${CRAFT_STAGE}/usr/lib64/pkgconfig:${CRAFT_STAGE}/usr/lib/${CRAFT_ARCH_TRIPLET_BUILD_FOR}/pkgconfig
    qmake-parameters:
      - CONFIG+=c++17
      - CONFIG+=disable-cuda
      - CONFIG+=disable-libdrm
      - QMAKE_LFLAGS+=-Wl,-rpath-link,${CRAFT_STAGE}/usr/lib/${CRAFT_ARCH_TRIPLET_BUILD_FOR}:${CRAFT_STAGE}/usr/lib:${CRAFT_STAGE}/usr/lib64
      - PREFIX=/usr
      - INCLUDEPATH+=${CRAFT_STAGE}/usr/include/SDL2
    after:
      - ffmpeg
    build-packages:
      - libflac-dev
      - libopus-dev
      - libssl-dev
      - libvdpau-dev
      - libxkbcommon-dev
      - qt6-base-dev
      - qt6-declarative-dev
      - qt6-svg-dev
      - qt6-wayland-dev
      - libvulkan-dev
      - wayland-protocols
      - libdecor-0-dev
      - libplacebo-dev
      - libsdl3-dev
      - libsdl2-compat-dev
      - libsdl2-ttf-dev
      - libva-dev
      - libdav1d-dev
    stage-packages:
      - libasound2t64
      - libasyncns0
      - libdav1d7
      - libdecor-0-0
      - libdecor-0-plugin-1-cairo
      - libdrm2
      - libflac14
      - libfontconfig1
      - libfreetype6
      - libogg0
      - libopus0
      - libplacebo360
      - libpng16-16t64
      - libpulse0
      - libsdl2-compat
      - libsdl2-compat-shim
      - libsdl2-ttf-2.0-0
      - libsdl3-0
      - libqt6core6t64
      - libqt6dbus6
      - libqt6gui6
      - libqt6network6
      - libqt6opengl6
      - libqt6openglwidgets6
      - libqt6qml6
      - libqt6qmlmodels6
      - libqt6quick6
      - libqt6quickcontrols2-6
      - libqt6quicktemplates2-6
      - libqt6svg6
      - libqt6waylandclient6
      - libqt6widgets6
      - libsndfile1
      - libsndio7.0
      - libssl3t64
      - libvorbis0a
      - libvorbisenc2
      - libwayland-client0
      - libwayland-cursor0
      - libwayland-egl1
      - libx11-6
      - libx11-xcb1
      - libxau6
      - libxcb1
      - libxcursor1
      - libxdmcp6
      - libxext6
      - libxfixes3
      - libxi6
      - libxinerama1
      - libxkbcommon0
      - libxkbcommon-x11-0
      - libxrandr2
      - libxrender1
      - libxss1
      - qml6-module-qt-labs-qmlmodels
      - qml6-module-qtqml
      - qml6-module-qtqml-models
      - qml6-module-qtqml-workerscript
      - qml6-module-qtquick
      - qml6-module-qtquick-controls
      - qml6-module-qtquick-layouts
      - qml6-module-qtquick-shapes
      - qml6-module-qtquick-templates
      - qml6-module-qtquick-window
      - qt6-qpa-plugins
      - qt6-svg-plugins
      - qt6-wayland

  ffmpeg:
    plugin: autotools
    source: https://github.com/cgutman/FFmpeg.git
    source-branch: moonlight_9.0.2_r1
    source-depth: 1
    autotools-configure-parameters:
      - --fatal-warnings
      - --disable-stripping
      - --enable-pic
      - --enable-lto
      - --enable-shared
      - --disable-static
      - --disable-all
      - --disable-v4l2-m2m
      - --disable-v4l2-request
      - --enable-avcodec
      - --enable-avformat
      - --enable-swscale
      - --enable-libdav1d
      - --enable-decoder=libdav1d
      - --enable-decoder=h264
      - --enable-decoder=hevc
      - --enable-decoder=av1
      - --enable-hwaccel=h264_vaapi
      - --enable-hwaccel=hevc_vaapi
      - --enable-hwaccel=av1_vaapi
      - --enable-hwaccel=h264_vdpau
      - --enable-hwaccel=hevc_vdpau
      - --enable-hwaccel=av1_vdpau
      - --enable-hwaccel=h264_vulkan
      - --enable-hwaccel=hevc_vulkan
      - --enable-hwaccel=av1_vulkan
      - --prefix=/usr
    build-environment:
      - CFLAGS: -O2 -g -pipe
      - CXXFLAGS: -O2 -g -pipe
      - PKG_CONFIG_PATH: ${CRAFT_STAGE}/lib/pkgconfig:${CRAFT_STAGE}/lib64/pkgconfig:${CRAFT_STAGE}/usr/lib/pkgconfig:${CRAFT_STAGE}/usr/lib64/pkgconfig:${CRAFT_STAGE}/usr/lib/${CRAFT_ARCH_TRIPLET_BUILD_FOR}/pkgconfig
    build-packages:
      - libvdpau-dev
      - libx265-dev
      - nasm
      - libvulkan-dev
      - libva-dev
      - libdav1d-dev
    stage-packages:
      - libdrm2
      - libvdpau1
      - libx11-6
      - libxau6
      - libxcb1
      - libxdmcp6
      - libxext6
      - libxfixes3

  # This part removes all the files in this snap which already exist in
  # connected content and base snaps. Since these files will be available
  # at runtime from the content and base snaps, they do not need to be
  # included in this snap itself.
  # More info: https://snapcraft-utils-library.readthedocs.io/en/latest/lib/cleanup.html
  cleanup:
    after:  # Make this part run last; list all your other parts here
      - moonlight-qt
    plugin: nil
    build-snaps:  # List all content-snaps and base snaps you're using here
      - core26
    override-prime: |
      set -eux
      for snap in "core26"; do  # List all content-snaps and base snaps you're using here
        cd "/snap/$snap/current" && find . -type f,l -exec rm -f "$CRAFT_PRIME/{}" "$CRAFT_PRIME/usr/{}" \;
      done
      for CRUFT in bug lintian man; do
        rm -rf $CRAFT_PRIME/usr/share/$CRUFT
      done
      find $CRAFT_PRIME/usr/share/doc/ -type f -not -name 'copyright' -delete
      find $CRAFT_PRIME/usr/share -type d -empty -delete
