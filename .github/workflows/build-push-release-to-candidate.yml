name: CANDIDATE amd64 builds (stable)
on:
  push:
    branches: [candidate]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: candidate-build
  cancel-in-progress: true

jobs:
  build-and-publish:
    uses: ./.github/workflows/build-publish.yml
    with:
      channel: candidate
    secrets:
      SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.STORE_LOGIN_CANDIDATE }}
